name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          go test ./...
          go vet ./...
          for script in install.sh update.sh uninstall.sh deploy/frigotehnica-cloudflared-update; do sh -n "$script"; done
          python3 -m unittest discover -s scripts -p 'test_*.py'
          CGO_ENABLED=0 go build -o /tmp/frigotehnica-native .
          FRIGOTEHNICA_TEST_UI=/tmp/frigotehnica-native python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build ARMv7 UI
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: go build -trimpath -ldflags "-s -w" -o frigotehnica-tunnel-ui-linux-armv7 .
      - name: Build x86_64 UI
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags "-s -w" -o frigotehnica-tunnel-ui-linux-amd64 .
      - name: Download and verify latest stable cloudflared
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api repos/cloudflare/cloudflared/releases/latest)
          echo "Packaging cloudflared $(jq -r '.tag_name' <<< "$release")"

          for arch in armhf amd64; do
            asset="cloudflared-linux-$arch"
            url=$(jq -er --arg name "$asset" \
              '.assets[] | select(.name == $name) | .browser_download_url' <<< "$release")
            digest=$(jq -er --arg name "$asset" \
              '.assets[] | select(.name == $name) | .digest' <<< "$release")

            [[ "$digest" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
            sha=${digest#sha256:}
            curl -fsSL --retry 3 "$url" -o "$asset"
            printf '%s  %s\n' "$sha" "$asset" | sha256sum -c -

            case "$arch" in
              armhf) key=CLOUDFLARED_ARMV7_SHA256 ;;
              amd64) key=CLOUDFLARED_AMD64_SHA256 ;;
            esac
            sed -i "s/^${key}=.*/${key}=${sha}/" install.sh
          done
      - name: Normalize script line endings
        run: |
          sed -i 's/\r$//' install.sh update.sh uninstall.sh
      - name: Pin installer checksum to this build
        run: |
          arm_sha=$(sha256sum frigotehnica-tunnel-ui-linux-armv7 | awk '{print $1}')
          amd64_sha=$(sha256sum frigotehnica-tunnel-ui-linux-amd64 | awk '{print $1}')
          sed -i "s/^UI_ARMV7_SHA256=.*/UI_ARMV7_SHA256=$arm_sha/" install.sh
          sed -i "s/^UI_AMD64_SHA256=.*/UI_AMD64_SHA256=$amd64_sha/" install.sh
          update_sha=$(sha256sum update.sh | awk '{print $1}')
          sed -i "s/^UPDATE_SCRIPT_SHA256=.*/UPDATE_SCRIPT_SHA256=$update_sha/" install.sh
          sed -i "s/^RELEASE_VERSION=.*/RELEASE_VERSION=${GITHUB_REF_NAME}/" install.sh
      - name: Checksums
        run: |
          sha256sum \
            frigotehnica-tunnel-ui-linux-armv7 \
            frigotehnica-tunnel-ui-linux-amd64 \
            cloudflared-linux-armhf \
            cloudflared-linux-amd64 \
            install.sh update.sh uninstall.sh > SHA256SUMS
      - name: Generate per-release install, update, and uninstall commands
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body --jq '.body' > release-notes.md || true
          python3 scripts/release_commands.py --tag "$GITHUB_REF_NAME"
          cat COMMANDS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            frigotehnica-tunnel-ui-linux-armv7
            frigotehnica-tunnel-ui-linux-amd64
            cloudflared-linux-armhf
            cloudflared-linux-amd64
            install.sh
            update.sh
            uninstall.sh
            SHA256SUMS
            COMMANDS.md
            README.md
