name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build ARMv7 UI
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: go build -trimpath -ldflags "-s -w" -o frigotehnica-tunnel-ui-linux-armv7 .
      - name: Download and verify cloudflared
        run: |
          curl -fL --proto '=https' --tlsv1.2 \
            -o cloudflared-linux-armhf-2026.8.2 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/cloudflared-linux-armhf
          echo "8e17268b7033061f505cd560eeafb04fdf020a354c975d1f0197bb63e9d0e0e5  cloudflared-linux-armhf-2026.8.2" | sha256sum -c -
      - name: Pin installer checksum to this build
        run: |
          ui_sha=$(sha256sum frigotehnica-tunnel-ui-linux-armv7 | awk '{print $1}')
          sed -i "s/^UI_SHA256=.*/UI_SHA256=$ui_sha/" install.sh
      - name: Checksums
        run: sha256sum frigotehnica-tunnel-ui-linux-armv7 cloudflared-linux-armhf-2026.8.2 install.sh uninstall.sh > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            frigotehnica-tunnel-ui-linux-armv7
            cloudflared-linux-armhf-2026.8.2
            install.sh
            uninstall.sh
            SHA256SUMS
