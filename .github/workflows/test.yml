name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: sh -n install.sh && sh -n uninstall.sh && sh -n deploy/frigotehnica-boss-proxy.openrc
      - name: Cross-compile supported devices
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/boss-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o /tmp/boss-armv7 .
