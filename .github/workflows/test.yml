name: tests
on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: for script in install.sh update.sh uninstall.sh deploy/frigotehnica-cloudflared-update; do sh -n "$script"; done
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Cross-build BOSS architectures
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/frigotehnica-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o /tmp/frigotehnica-armv7 .
